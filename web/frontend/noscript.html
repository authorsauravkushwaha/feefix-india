<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeeFix needs JavaScript</title>
  <meta name="robots" content="noindex" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f19;
      color:#dbe6ff;font-family:Inter,system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
    .card{max-width:460px}
    h1{font-size:1.4rem;margin:0 0 10px}
    p{color:#93a3c8;font-size:.92rem;line-height:1.6;margin:0 0 8px}
    a{color:#6ea8ff}
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:2.4rem">🎓</div>
    <h1>FeeFix needs JavaScript enabled</h1>
    <p>The eligibility matcher runs the rules in your browser so your income,
       category and marks are matched against every scheme instantly.</p>
    <p>No script means no matches — but nothing about you is stored either.</p>
    <p><a href="/">Retry with JavaScript enabled →</a></p>
  </div>
</body>
</html>

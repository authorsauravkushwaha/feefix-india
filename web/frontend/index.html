<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeeFix — Find the funding you qualify for</title>
  <meta name="description" content="FeeFix matches Indian students with scholarships and fee-waiver schemes based on personal eligibility — discover, understand, apply, track." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="grain"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/home">
        <img src="/assets/logo.svg" alt="FeeFix logo" />
        <span class="brand-name">Fee<em>Fix</em></span>
      </a>
      <div class="nav-links" id="navLinks"></div>
    </div>
  </nav>

  <main id="view" class="wrap"></main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div class="f-brand">
        <a class="brand" href="#/home">
          <img src="/assets/logo.svg" alt="FeeFix logo" />
          <span class="brand-name">Fee<em>Fix</em></span>
        </a>
        <p id="footerTagline"></p>
      </div>
      <div class="f-brand">
        <small id="footerDisclaimer"></small>
        <small id="footerMade"></small>
      </div>
    </div>
  </footer>

  <!-- scheme detail drawer -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- reach-layer chat -->
  <div class="chat-panel" id="chatPanel" aria-hidden="true"></div>
  <button class="chat-fab" id="chatFab" title="Chat with FeeFix">💬</button>

  <div class="toast" id="toast"></div>

  <!-- account modal -->
  <div class="auth-modal" id="authModal" aria-hidden="true">
    <div class="auth-card">
      <button class="drawer-x" id="authClose" aria-label="Close">✕</button>
      <h3 id="authTitle">🔐 Sign in to FeeFix</h3>
      <p class="auth-sub">Your matches, tracker and reminders follow your login — on any device.</p>
      <div class="auth-field" id="authNameWrap" hidden>
        <label for="authName">Name (optional)</label>
        <input id="authName" type="text" autocomplete="name" placeholder="Your name" />
      </div>
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="auth-field">
        <label for="authPass">Password</label>
        <input id="authPass" type="password" autocomplete="current-password" placeholder="Min 8 characters" />
      </div>
      <div class="auth-error" id="authError"></div>
      <div class="auth-actions">
        <button class="btn btn-primary" id="authLogin">Sign in</button>
        <button class="btn btn-ghost" id="authRegister">Create account</button>
      </div>
      <p class="auth-note">🔒 Passwords are PBKDF2-hashed (600k rounds) — never stored, never shared.</p>
    </div>
  </div>

  <script src="/app.js" defer></script>
  <script src="/auth-gate.js" defer></script>
</body>
</html>

# Pre-commit hooks — the cheap checks run before a commit exists, not after.
#
# Rationale (see docs/security/HARDENING.md): a CI-only gate can be sidestepped
# by pushing straight to a branch or by a job that gets disabled. These hooks
# make the same checks part of the developer's normal loop, and the CI jobs
# still run them on the server side where they cannot be skipped locally.
repos:
  - repo: local
    hooks:
      - id: feefix-secret-scan
        name: FeeFix secret scan (staged files)
        description: Provider tokens, encoded/split secrets and high-entropy literals.
        entry: python -m agents.secret_scan --staged
        language: system
        pass_filenames: false
        always_run: true

      - id: feefix-security-tests
        name: FeeFix security regression suite
        description: One suite per attack class (fast enough to run on every commit).
        entry: python -m pytest tests/test_security_hardening.py tests/test_secret_hygiene.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: feefix-bandit
        name: bandit static security analysis (medium+)
        entry: python -m bandit -q -r backend agents ai ml -x tests -ll
        language: system
        pass_filenames: false
        files: ^(backend|agents|ai|ml)/.*\.py$

      - id: feefix-secret-scan-history
        name: FeeFix secret scan (full git history)
        description: A secret committed and then deleted still fails the push.
        entry: python -m agents.secret_scan --history
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: feefix-tests
        name: full test suite
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
